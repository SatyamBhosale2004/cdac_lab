<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <script src="script.js" defer></script>
    <title></title>
</head>
<body>
    <h1 id="page-title">Hello</h1>
    <p id="status">Not started</p>
    <ul id="topic-list"></ul>
    <div id="container">
        <input type="password" id="password-field">
        <input type="number" id="number-field">
    </div>

    <button id="greet" type="button">Greet</button>
    <p id="greeting" role="status">Hello bitch</p>

    <form id="resume-form">
      <div>
        <label for="first-name">First name</label>
        <input id="first-name" name="firstName" type="text" required minlength="2">
      </div>

      <div>
        <label for="last-name">Last name</label>
        <input id="last-name" name="lastName" type="text" required minlength="2">
      </div>

      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required minlength="10"></textarea>
      </div>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
</body>
</html>
